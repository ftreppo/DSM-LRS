{% extends 'base.html' %}{% block content %}<h1>Semester Review</h1><p class="muted">{{ class_id }} · {{ subject_id }} · due domande, nessun midpoint.</p>{% if success %}<div class="success">{{ success }}</div>{% endif %}
<form class="card formgrid" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Studente<select name="student_id">{% for s in students %}<option value="{{ s.student_id }}">{{ s.display_name }}</option>{% endfor %}</select></label><label>Dominio<select name="domain_code"><option>READING</option><option>SPELLING</option><option>WRITING</option><option>MATHEMATICS</option></select></label><label>Livello attuale<select name="current_impact_level">{% for n in [1,2,3,4] %}<option>{{ n }}</option>{% endfor %}</select></label><label>1. Cambiamento significativo?<select name="q1"><option>NO_CHANGE</option><option>YES</option><option>INSUFFICIENT_EVIDENCE</option></select></label><label>2. Direzione se YES<select name="q2"><option value=""></option><option>IMPROVED</option><option>MORE_IMPACT</option></select></label><label>Livello suggerito facoltativo<select name="suggested_level"><option value=""></option>{% for n in [1,2,3,4] %}<option>{{ n }}</option>{% endfor %}</select></label><label class="wide">Nota evidenza<textarea name="evidence_note" rows="4"></textarea></label><button>Salva osservazione</button></form>{% endblock %}
