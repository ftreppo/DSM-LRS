{% extends 'base.html' %}{% block content %}<h1>Operator Console</h1><p class="muted">Può preparare draft; non può approvare.</p><form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Student ID facoltativo<input name="student_id"></label><label>Input naturale<textarea name="source_text" rows="5" required></textarea></label><button>Crea DRAFT</button></form><h2>Draft</h2><table><tr><th>ID</th><th>Studente</th><th>Stato</th><th>Input</th></tr>{% for d in drafts %}<tr><td>{{ d.draft_id }}</td><td>{{ d.student_id or '—' }}</td><td>{{ d.status }}</td><td>{{ d.source_text }}</td></tr>{% endfor %}</table>{% endblock %}
