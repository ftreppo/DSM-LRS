name: DSM-LRS public verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Auth MVP regression
        working-directory: auth-mvp/v0.3-public.1
        run: pytest -q

      - name: World News regression
        run: pytest -q pipelines/world-news/test_world_news_weekly_pipeline_v0_1.py

      - name: Library provider contract
        run: pytest -q tests/test_library_provider_contract.py

      - name: Canonical generic Adapter pointer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("integrations/lrs-adapter/consumer.json").read_text(encoding="utf-8"))
          assert data["repository"] == "https://github.com/ftreppo/lrs-adapter"
          assert data["pinned_version"] == "0.1.0-alpha.1"
          assert data["dependency_direction"] == "DSM-LRS -> lrs-adapter"
          assert data["canonical"] is True
          assert "NON-CANONICAL" in Path("adapter/generic-prototype/README.md").read_text(encoding="utf-8")
          print("Canonical boundary: PASS")
          PY
